<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="BAKUGO'S LOCATION — a Five Nights at Bakugo's-inspired horror experience by Neptune Productions.">
  <meta name="theme-color" content="#000000">
  <title>BAKUGO'S LOCATION — by Neptune Productions</title>
  <link rel="icon" type="image/png" href="assets/images/char_bakugo.png">
  <link rel="apple-touch-icon" href="assets/images/char_bakugo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="crt" aria-hidden="true">
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="raster"></div>
    <canvas id="noise"></canvas>
    <canvas id="ash"></canvas>
    <div class="flash"></div>
  </div>

  <div class="hud hud-tl" aria-hidden="true"><span class="rec-dot"></span> REC&nbsp;<span id="recTime">00:00:00</span></div>
  <div class="hud hud-tr" aria-hidden="true">SIGNAL: <span class="sig" id="sigStatus">STABLE</span></div>
  <div class="hud hud-bl" aria-hidden="true">AUDIO: <span class="sig" id="audioStatus">INIT</span></div>
  <div class="hud hud-br" aria-hidden="true">NEPTUNE PRODUCTIONS [C]</div>

  <div id="boot" aria-hidden="true">
    <div class="boot-inner">
      <div class="boot-log" id="bootLog"></div>
      <div class="boot-prompt hidden" id="bootPrompt">&gt; [ CLICK TO BEGIN ]</div>
    </div>
  </div>

  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="duotone" aria-hidden="true"></div>
  </div>

  <audio id="menuAudio" src="assets/audio/menu.ogg" loop preload="auto" playsinline webkit-playsinline></audio>
  <audio id="cutsceneAudio" src="assets/audio/cutscene.ogg" preload="auto" playsinline webkit-playsinline></audio>

  <script src="js/config.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
